<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">Personal finance</p>
                <h1>Personal Finance Tracker</h1>
            </div>
            <button id="clearExpenses" class="button button-danger" type="button">Clear all</button>
        </header>

        <section class="summary-grid" aria-label="Expense summary">
            <article class="summary-card summary-card-primary">
                <span>Total expenses</span>
                <strong>$<span id="totalExpenses">0.00</span></strong>
            </article>
            <article class="summary-card">
                <span>This month</span>
                <strong>$<span id="monthlyExpenses">0.00</span></strong>
            </article>
            <article class="summary-card">
                <span>Transactions</span>
                <strong id="expenseCount">0</strong>
            </article>
            <article class="summary-card">
                <span>Highest expense</span>
                <strong>$<span id="highestExpense">0.00</span></strong>
            </article>
        </section>

        <section class="workspace">
            <form id="expenseForm" class="expense-form">
                <h2>Add expense</h2>
                <label for="expenseName">Expense name</label>
                <input type="text" id="expenseName" placeholder="e.g. Groceries" required maxlength="80">

                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="0.00" required min="0.01" step="0.01">

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit" class="button button-primary">Add expense</button>
            </form>

            <section class="expense-panel">
                <div class="panel-heading">
                    <h2>Expenses</h2>
                    <button id="exportExpenses" class="button button-secondary" type="button">Export CSV</button>
                </div>
                <p class="storage-note">Your expenses are saved in this browser using IndexedDB.</p>

                <div class="filters">
                    <label for="searchExpenses">Search</label>
                    <input type="search" id="searchExpenses" placeholder="Search expenses">

                    <label for="filterCategory">Category</label>
                    <select id="filterCategory">
                        <option value="All">All categories</option>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="sortExpenses">Sort</label>
                    <select id="sortExpenses">
                        <option value="date-desc">Newest first</option>
                        <option value="date-asc">Oldest first</option>
                        <option value="amount-desc">Highest amount</option>
                        <option value="amount-asc">Lowest amount</option>
                        <option value="name-asc">Name A-Z</option>
                    </select>
                </div>

                <p id="storageStatus" class="storage-status" role="alert" hidden></p>
                <div id="expenseList" aria-live="polite"></div>
            </section>
        </section>
    </main>

    <dialog id="editDialog">
        <form id="editForm" class="edit-form">
            <h2>Edit expense</h2>
            <label for="editName">Expense name</label>
            <input type="text" id="editName" required maxlength="80">

            <label for="editAmount">Amount</label>
            <input type="number" id="editAmount" required min="0.01" step="0.01">

            <label for="editCategory">Category</label>
            <select id="editCategory" required>
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>

            <label for="editDate">Date</label>
            <input type="date" id="editDate" required>

            <div class="dialog-actions">
                <button type="button" id="cancelEdit" class="button button-secondary">Cancel</button>
                <button type="submit" class="button button-primary">Save changes</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
